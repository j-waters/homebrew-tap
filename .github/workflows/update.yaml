name: Bump packages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  bump-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.TAP_BUMP_TOKEN }}

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get formulae and casks
        id: packages
        run: |
          # claude-usage is pinned to a commit SHA (upstream doesn't tag
          # releases), so brew bump errors on it instead of skipping it -
          # excluded here so that failure doesn't abort the cask bump step.
          formulae=$(find Formula -maxdepth 1 -name '*.rb' ! -name 'claude-usage.rb' -exec basename -s .rb {} + | tr '\n' ' ')
          casks=$(find Casks -maxdepth 1 -name '*.rb' -exec basename -s .rb {} + | tr '\n' ' ')
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"
          echo "casks=$casks" >> "$GITHUB_OUTPUT"

      - name: Bump packages
        uses: Homebrew/actions/bump-packages@main
        with:
          token: ${{ secrets.TAP_BUMP_TOKEN }}
          formulae: ${{ steps.packages.outputs.formulae }}
          casks: ${{ steps.packages.outputs.casks }}
          fork: false

      # Bump packages authors PRs with TAP_BUMP_TOKEN (not the default
      # GITHUB_TOKEN), so tests.yml actually triggers on them - GitHub
      # suppresses pull_request events authored by the default token to
      # prevent recursive workflow runs. That lets auto-merge below wait
      # on a real brew test-bot result instead of nothing.
      - name: Enable auto-merge on bump PRs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "${{ github.repository }}" --state open \
              --json number,headRefName,autoMergeRequest \
            | jq -r '.[] | select(.headRefName | startswith("bump-")) | select(.autoMergeRequest == null) | .number' \
            | while read -r n; do
                gh pr merge "$n" --repo "${{ github.repository }}" --auto --squash
              done
