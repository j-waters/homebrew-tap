name: Bump packages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  bump-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get formulae and casks
        id: packages
        run: |
          # claude-usage is pinned to a commit SHA (upstream doesn't tag
          # releases), so brew bump errors on it instead of skipping it -
          # excluded here so that failure doesn't abort the cask bump step.
          formulae=$(find Formula -maxdepth 1 -name '*.rb' ! -name 'claude-usage.rb' -exec basename -s .rb {} + | tr '\n' ' ')
          casks=$(find Casks -maxdepth 1 -name '*.rb' -exec basename -s .rb {} + | tr '\n' ' ')
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"
          echo "casks=$casks" >> "$GITHUB_OUTPUT"

      - name: Bump packages
        uses: Homebrew/actions/bump-packages@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          formulae: ${{ steps.packages.outputs.formulae }}
          casks: ${{ steps.packages.outputs.casks }}
          fork: false
